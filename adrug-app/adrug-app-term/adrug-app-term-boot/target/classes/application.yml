server:
  port: 8082

spring:
  profiles:
    active: dev
  application:
    name: adrug-app-term
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import: optional:nacos:${spring.application.name}.yaml

seata:
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
  tx-service-group: adrug_tx_group
  service:
    vgroup-mapping:
      adrug_tx_group: default
  data-source-proxy-mode: AT
